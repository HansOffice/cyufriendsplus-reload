name: Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build Paper
        run: mvn -B -DskipTests -Ppaper package

      - name: Build Folia
        run: mvn -B -DskipTests -Pfolia package

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: cyufriends-reload-plugin
          path: |
            target/cyufriends-reload-*.jar
            !target/cyufriends-reload-*-api.jar
            !target/original-*.jar

      - name: Upload API jar
        uses: actions/upload-artifact@v4
        with:
          name: cyufriends-reload-api
          path: target/cyufriends-reload-*-api.jar

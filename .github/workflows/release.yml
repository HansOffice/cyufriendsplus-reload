name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build Paper
        run: mvn -B -DskipTests -Ppaper,full package

      - name: Build Folia
        run: mvn -B -DskipTests -Pfolia package

      - name: Prepare release files
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release
          cp "target/cyufriends-reload-paper-${version}.jar" "release/cyufriends-reload-paper-${version}.jar"
          cp "target/cyufriends-reload-paper-${version}-legacy-all.jar" "release/cyufriends-reload-paper-${version}-legacy-all.jar"
          cp "target/cyufriends-reload-paper-${version}-api.jar" "release/cyufriends-reload-paper-${version}-api.jar"
          cp "target/cyufriends-reload-folia-${version}.jar" "release/cyufriends-reload-folia-${version}.jar"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: CyuFriends Reload ${{ github.ref_name }}
          body: |
            CyuFriends Reload ${{ github.ref_name }}

            - Paper / Purpur 服主下载 `paper` 包
            - Folia 服主下载 `folia` 包
            - 需要完整依赖包时下载 `paper-legacy-all` 包
            - 附属插件开发者可使用带 `api` 的 API jar
            - 跨服同步需要另行安装配套代理端插件；代理端源码不包含在本开源仓库中
          files: |
            release/*.jar

      - name: Publish Maven package
        continue-on-error: true
        run: mvn -B -DskipTests -Ppaper deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# 欢迎使用 CyuFriends-Reload
# MineBBS 主页：https://www.minebbs.com/members/hansoffice.59149/
# QQ 交流群：331910315
#
# --- 常用权限 ---
# cyufriends.use   - 普通玩家功能
# cyufriends.admin - 重载与管理功能
#
# --- 相关文件 ---
# Permissions.yml - 完整权限节点
# messages.yml    - 玩家提示与帮助文本
# gui/*.yml       - 菜单布局、材质与动作
# --- 调试日志 ---
# 排查问题时临时开启，平时保持关闭
# detail-level: 0 基础 / 1 关键过程 / 2 完整交互
debugLog:
  enable-console-output: false
  enable-file-output: false
  file: "logs/debug.log"
  detail-level: 0
  slow-db-ms: 150

# --- 数据库存储 ---
# type: SQLite 或 MySQL；单服保持 SQLite 即可
database:
  type: SQLite
  host: localhost
  port: 3306
  database: cyufriends
  username: root
  password: ""

# --- 基础设置 ---
settings:
  request-cooldown: 60            # 好友申请冷却兜底值；没给玩家权限档时走这里
  text-input-timeout-seconds: 90  # GUI 聊天输入模式等待时长（秒）
  tp-request-timeout-seconds: 60  # 需要确认的好友传送请求保留时长（秒）
  max-friends-default: 50         # 默认最大好友数；没做权限加成时就按这个上限走

# --- GUI 头颅与自定义物品 ---
# default-offline-head 为空时，将按插件默认离线头处理
# 支持格式：
# 1. 玩家名
# 2. basehead-<Base64>
# 3. url-<纹理地址>
# 4. 纯纹理哈希
gui:
  default-offline-head: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZDM0NGY5YmJiMzcwMWM3ZWVjZTAxODY0MmE3ODM3YzMzMzE1YWMzOTg4ZWUyYmZkZTk2ZTg3NzI0OTZlNzQ4NSJ9fX0="
  head-cache-size: 512    # 静态头颅缓存上限；无需太大，推荐范围 128 ~ 1024
  pagination:
    disabled:
      enabled: true
      previous:
        material: GRAY_STAINED_GLASS_PANE
        name: "<#3A4352>已是第一页</#3A4352>"
        lore:
          - "<#8A96A8>当前页</#8A96A8> <#D7DEE8>%page%</#D7DEE8><#8A96A8>/</#8A96A8><#D7DEE8>%total_pages%</#D7DEE8>"
      next:
        material: GRAY_STAINED_GLASS_PANE
        name: "<#3A4352>已是最后一页</#3A4352>"
        lore:
          - "<#8A96A8>当前页</#8A96A8> <#D7DEE8>%page%</#D7DEE8><#8A96A8>/</#8A96A8><#D7DEE8>%total_pages%</#D7DEE8>"

# --- 进服摘要 ---
# {onlineCount} = 在线好友数量
# {unreadCount} = 未读留言数量
joinChat:
  enabled: true
  lines:
    - "<#3A4352><st>                              </st></#3A4352>"
    - "<#D7DEE8>欢迎回来，<#7DD3FC><bold>CyuFriends</bold></#7DD3FC> 已同步你的社交状态。</#D7DEE8>"
    - "<#D7DEE8>在线好友 <#7DD3FC>{onlineCount}</#7DD3FC> 位，未读留言 <#7DD3FC>{unreadCount}</#7DD3FC> 条。</#D7DEE8>"
    - "<#3A4352><st>                              </st></#3A4352>"

# --- 快捷交互 ---
# 玩家空手 Shift + 右键其他玩家时，会弹出好友交互
# 如果你怕和别的插件冲突，直接改成 false
interactionSettings:
  shiftRightClickMenu: true
  cooldownSeconds: 3
  sound: quick-interact

# --- 禁止好友传送进入的世界 ---
# 这里填世界名
# 填进去的世界，好友传送会直接失败
# 不需要限制就留空
disabledWorlds: []

# --- 好友申请限制 ---
# 如果玩家有 cyufriends.request.vip，就会用 vip 这一档
# 如果你把 vip 改成 premium，那权限节点也要跟着改成 cyufriends.request.premium
# 你可以继续往下加 mvp、sponsor、legend 之类任意组名，不只限于 vip / svip
requestLimits:
  default:
    daily: 20         # 每日最多发送多少次好友申请；0 表示不限制
    cooldown: 60      # 两次好友申请之间的冷却（秒）
  vip:
    daily: 35
    cooldown: 40
  svip:
    daily: 60
    cooldown: 20

# --- 好友申请附言 ---
# max-length    = 玩家最多能写多长
# preview-length = 菜单和聊天里最多显示多长，防止太长刷屏
requestNotes:
  max-length: 48
  preview-length: 24

# --- 私聊与离线留言 ---
# messageCooldown   = 私聊发送冷却（秒）
# messageExpiration = 离线留言保留时间（秒）；0 表示不自动清理
# 604800 秒就是 7 天
messageCooldown: 60
messageExpiration: 604800

# --- 黑名单聊天过滤 ---
chatFilter:
  hide-blocked-public-chat: true  # 拉黑后，不再看到对方的公共聊天
  bypass-permission: "cyufriends.bypass.chatfilter"

# --- 动态限制 ---
# 如果玩家有 cyufriends.status.vip，就会用 vip 这一档
# 你可以继续往下加 mvp、sponsor、legend 之类任意组名
# maxStatuses      = 最多保留多少条动态
# publishCooldown  = 发布动态冷却
# commentCooldown  = 评论动态冷却
statusLimits:
  default:
    maxStatuses: 20
    publishCooldown: 60
    commentCooldown: 15
  vip:
    maxStatuses: 30
    publishCooldown: 40
    commentCooldown: 10
  svip:
    maxStatuses: 50
    publishCooldown: 20
    commentCooldown: 5

# --- 留言墙限制 ---
# 如果玩家有 cyufriends.wall.vip，就会用 vip 这一档
# 你可以继续往下加 mvp、sponsor、legend 之类任意组名
# maxMessages   = 单个留言墙最多保留多少条留言
# postCooldown  = 发布留言冷却
# replyCooldown = 评论留言冷却
wallLimits:
  default:
    maxMessages: 20
    postCooldown: 60
    replyCooldown: 15
  vip:
    maxMessages: 30
    postCooldown: 40
    replyCooldown: 10
  svip:
    maxMessages: 50
    postCooldown: 20
    replyCooldown: 5

# --- 留言墙权限 ---
# default-visibility:
# public  = 所有人可见
# friends = 仅好友可见
# private = 仅墙主可见
# 不懂这段就保持默认
# 默认这一套就是“好友才能留言和评论，别人不乱写墙”
wallPermissions:
  default-visibility: public
  view-requires-friend: false    # 查看留言墙是否必须先成为好友
  post-requires-friend: true     # 发布留言是否必须先成为好友
  comment-requires-friend: true  # 评论留言是否必须先成为好友
  like-requires-friend: false    # 点赞留言是否必须先成为好友
  allow-self: true               # 是否允许查看 / 管理自己的留言墙

# --- 留言墙审核 ---
# enabled                 = 留言本体审核
# comment-enabled         = 留言评论审核
# auto-approve-self       = 自己发给自己的内容是否自动通过
# notify-owner            = 有待审内容时是否提醒墙主
# audit-log               = 是否记录审核日志
# audit-file              = 审核日志输出位置（相对插件目录）
# 如果你的服平时没人审核，建议直接关掉
wallModeration:
  enabled: false
  auto-approve-self: true
  notify-owner: true
  comment-enabled: false
  comment-auto-approve-self: true
  comment-notify-owner: true
  audit-log: true
  audit-file: "logs/wall-moderation.log"

# --- 社交互动提醒 ---
# 服务器总开关
# 这里关掉，就是整个服不再发这种提醒
# 这里开着时，玩家还能在自己的设置里继续细分关闭
socialNotifications:
  status-like: true      # 动态点赞提醒
  status-comment: true   # 动态评论提醒
  wall-post: true        # 新留言提醒
  wall-like: true        # 留言点赞提醒
  wall-comment: true     # 留言评论提醒
  preview-length: 24     # 评论 / 留言提醒中的内容预览长度

# --- 关系时间线 ---
# 关系时间线会记录：
# 1. 私聊
# 2. 动态点赞 / 评论
# 3. 留言发布 / 点赞 / 评论
# 这只是展示最近互动，不会影响实际好友功能
timeline:
  preview-length: 32   # 时间线卡片中的文本预览长度
  keep-per-friend: 32  # 每对好友最多保留多少条时间线记录

# --- 生日提醒 ---
# checkTime 使用 24 小时制 HH:mm
# advance-days 可写多个数字：
# 0 = 生日当天
# 1 = 提前 1 天
# 7 = 提前 7 天
# 如果你的服不用生日玩法，直接把 enabled 改成 false
birthdayReminder:
  enabled: false
  checkTime: "00:05"
  advance-days:
    - 0
    - 1
  friendMessage: "今天是 {player} 的生日，别忘了送上祝福。"
  advanceMessage: "{player} 还有 {days} 天就生日了，记得提前准备祝福。"
  disabledWorlds:
    - "text"

# --- 生日修改次数 ---
# 如果玩家有 cyufriends.birthday.vip，就会用 vip 这一档
# 这里也能继续往下加 mvp、sponsor、legend 之类任意组名
birthdayLimits:
  default: 1

# --- 个人资料 ---
# bio-max-length     = 签名最大长度
# bio-preview-length = 个人主页 / 列表里的签名预览长度
profile:
  bio-max-length: 64
  bio-preview-length: 32

# --- 模块开关 ---
# friend  是主体模块；如果你还要使用好友系统，请保持开启
# proxy   是跨服能力模块；Reload 首发暂不发布跨服代理，默认关闭，等代理端一起发布时再开启
# group   = 分组相关
# chat    = 私聊与离线留言
# social  = 动态、留言墙、互动提醒
# profile = 个人主页、生日、设置、通知中心
#
# 关闭模块后，相关命令、菜单入口和通知会一起隐藏
# 如果 friend 关闭，group / chat / social / profile 即使写 true 也不会启动
# proxy 独立，只影响跨服功能；单服发布包保持 false 更清晰
modules:
  proxy: false
  friend: true
  group: true
  chat: true
  social: true
  profile: true

# --- 跨服代理 ---
# 单服不用改这段，保持 enabled: false 就行
# 想启用跨服，需要同时满足：
# 1. modules.proxy = true
# 2. proxy.enabled = true
# 3. 所有后端服安装后端插件
# 4. 代理端安装对应 proxy 插件
# 5. 所有服使用同一套 channel / protocol-version / secret
# 6. 每台后端的 server-id 唯一
proxy:
  enabled: false
  server-id: "survival-1"   # 当前后端服唯一 ID
  # 可选：给 server-id 配置面向玩家显示的服名
  # server-names:
  #   survival-1: "生存一区"
  #   survival-2: "生存二区"
  channel: "cyufriends:gateway"      # 跨服通信频道名
  protocol-version: 1                # 协议版本；所有服必须一致
  secret: "change-this-secret"       # 共享密钥；所有服必须一致
  max-clock-skew-seconds: 15         # 允许的时钟偏差（秒）
  direct-message-timeout-seconds: 8  # 跨服私聊回执超时（秒）
  teleport-precheck-timeout-seconds: 6  # 跨服传送预检超时（秒）
  presence-refresh-seconds: 60       # 在线状态低频刷新；代理端重启后会自动恢复在线表

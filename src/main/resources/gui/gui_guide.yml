# ------------------------------------------------------------
# CyuFriends Reload GUI 速查
# ------------------------------------------------------------
#
# 文件位置:
# plugins/cyufriends-reload/gui/
#
# layout 控制格子
# items 控制按钮
# title 控制窗口标题
#
# 修改后可重启服务器，或执行 /friend reload

# ------------------------------------------------------------
# 文件入口
# ------------------------------------------------------------
#
# friends_list.yml              好友列表                  /friend list
# friend_profile.yml            好友资料                  /friend profile <玩家>
# add_friend.yml                添加好友确认              /friend addgui <玩家>
# friend_remove_confirm.yml     删除好友确认              /friend removeconfirm <玩家>
# friend_tag_manage.yml         标签管理                  /friend tagpanel <好友>
# friend_tag_colors.yml         标签颜色                  /friend tagcolorpanel <好友> <标签>
# friend_tag_filters.yml        标签筛选                  /friend tagfilterpanel
# groups_list.yml               分组列表                  /friend grouplist
# group_members.yml             分组成员                  /friend groupmembers <分组>
# group_move.yml                移动分组                  /friend groupmove <好友>
# requests_list.yml             好友申请                  /friend requests
# blacklist.yml                 黑名单                    /friend blacklist
# online_players.yml            在线玩家                  /friend online
# profile_home.yml              个人主页                  /friend gui
# settings_panel.yml            个人设置                  /settings
# messages_list.yml             未读留言                  /messages
# message_chat.yml              私聊会话                  /friend chat <好友>
# status_list.yml               动态列表                  /status
# wall_view.yml                 留言墙                    /wall <玩家>
# wall_pending.yml              待审核留言                /wall pending <玩家>
# wall_comment_pending.yml      待审核回复                /wall commentpending <墙ID>

# ------------------------------------------------------------
# 基本结构
# ------------------------------------------------------------
#
# title: "<gradient:#5FD9FF:#82E6D2><bold>好友资料</bold></gradient> <dark_gray>|</dark_gray> <gray>%target_name%</gray>"
#
# layout:
#   - "#########"
#   - "#   B   #"
#   - "#       #"
#   - "#   C   #"
#   - "#       #"
#   - "#########"
#
# items:
#   '#':
#     material: LIGHT_BLUE_STAINED_GLASS_PANE
#     name: " "
#
#   'B':
#     material: PLAYER_HEAD
#     head: "%player%"
#     name: "<aqua><bold>返回</bold></aqua>"
#     lore:
#       - "<gray>点击返回好友列表</gray>"
#     actions:
#       left:
#         - "[player] friend list"
#
#   'C':
#     material: BARRIER
#     name: "<red><bold>关闭</bold></red>"
#     actions:
#       left:
#         - "[close]"

# ------------------------------------------------------------
# layout
# ------------------------------------------------------------
#
# 每行 9 个字符
# 行数决定界面大小，6 行就是 54 格
# 同一个字符共用同一个按钮配置
# 空格表示空槽
#
# 示例:
#
# layout:
#   - "#########"
#   - "#FFFFFFF#"
#   - "#FFFFFFF#"
#   - "#FFFFFFF#"
#   - "#########"
#   - " T P R N "
#
# # = 边框
# F = 好友条目区域
# T/P/R/N = 底部功能按钮

# ------------------------------------------------------------
# items 字段
# ------------------------------------------------------------
#
# material
# 按钮材质或外部物品
#
# material: PAPER
# material: BARRIER
# material: PLAYER_HEAD
# material: PAPER#1001
# material: ia:命名空间:物品ID
# material: itemsadder:命名空间:物品ID
# material: ox:物品ID
# material: oraxen:物品ID
# material: nexo:物品ID
# material: ce:命名空间:物品ID
# material: craftengine:命名空间:物品ID
#
# 资源包贴图:
#
# material: PAPER
# custom_model_data: 1001
#
# 也可以简写:
#
# material: PAPER#1001
#
# CraftEngine 也可以写独立字段:
#
# craftengine: "命名空间:物品ID"
#
# head
# 头颅来源，material 通常保持 PLAYER_HEAD
#
# head: "%raw_name%"
# head: "Notch"
# head: "basehead-这里放Base64"
# head: "https://textures.minecraft.net/texture/xxxx"
#
# amount
# 物品数量
#
# amount: 1
#
# name
# 按钮名称，默认推荐 MiniMessage
#
# name: "<red><bold>关闭</bold></red>"
# name: "<aqua><bold>下一页</bold></aqua>"
#
# lore
# 按钮说明
#
# lore:
#   - "<gray>点击打开好友资料</gray>"
#   - "<gray>目标</gray> <white>%raw_name%</white>"
#
# sound / sounds
# 点击音效，不写时使用默认 GUI 音效
#
# sound: gui-confirm
# sounds:
#   left: gui-confirm
#   right: gui-secondary-click

# ------------------------------------------------------------
# actions
# ------------------------------------------------------------
#
# actions:
#   left:
#     - "[player] friend profile %raw_name%"
#   right:
#     - "[close]"
#
# 点击类型:
# left
# right
# shift_left
# shift_right
# middle
# double_click
# drop
# all
#
# 常用动作:
#
# - "[player] friend list"
# - "[player] friend profile %raw_name%"
# - "[player] wall %raw_name%"
# - "[player] status pin %status_id%"
# - "[console] say %player% 打开了好友界面"
# - "[close]"
# - "[sound] UI_BUTTON_CLICK"
# - "[prev_page]"
# - "[next_page]"
#
# 输入类动作由界面逻辑读取，改名会影响功能:
#
# - "[pm_input] %raw_name%"
# - "[note_input] %raw_name%"
# - "[note_detail_input] %raw_name%"
# - "[status_input]"
# - "[wall_input] %raw_name%"
# - "[birthday_input]"
# - "[bio_input]"
# - "[tag_color_input] %raw_name%||%primary_edit_tag%"

# ------------------------------------------------------------
# 可改和少动
# ------------------------------------------------------------
#
# 常改:
# material
# head
# name
# lore
# sound / sounds
# actions 里的提示音和命令
#
# 少动:
# 列表区域字符，例如 friends_list.yml 里的 F
# 分页按钮字符
# 输入类动作名
# 没有来源的占位符
#
# 如果只做美化，优先保留原 layout 和按钮字符

# ------------------------------------------------------------
# 占位符
# ------------------------------------------------------------
#
# 常见写法:
# %raw_name%
# %friend_name%
# %status_id%
# %content%
#
# 占位符由当前界面提供
# 同一个文件里已有的占位符最稳
#
# friends_list.yml 常见占位符:
# %friend_name%
# %raw_name%
# %group_name%
# %online_scope%
# %server_name%
#
# 示例:
#
# lore:
#   - "<gray>当前分组</gray> <white>%group_name%</white>"
#   - "<gray>当前服务器</gray> <white>%server_name%</white>"

# ------------------------------------------------------------
# title
# ------------------------------------------------------------
#
# title: "<gradient:#5FD9FF:#82E6D2><bold>留言墙</bold></gradient> <dark_gray>|</dark_gray> <gray>%target_name%</gray>"
#
# 支持 MiniMessage 和 & 颜色符号
# 默认文件使用 MiniMessage，建议沿用
#
# 常见占位符:
# %player%
# %target_name%
# %friend_name%
# %raw_name%
# %group_name%
# %tag_name%
# %filter_tag%
# %wall_id%
# %page%
# %view_mode%

# ------------------------------------------------------------
# 按钮模板
# ------------------------------------------------------------
#
# 返回按钮:
#
# 'B':
#   material: PLAYER_HEAD
#   head: "basehead-这里放Base64"
#   name: "<white><bold>返回好友列表</bold></white>"
#   lore:
#     - "<gray>点击后返回主界面</gray>"
#   actions:
#     left:
#       - "[sound] UI_BUTTON_CLICK"
#       - "[player] friend list"
#
# 关闭按钮:
#
# 'X':
#   material: BARRIER
#   name: "<red><bold>关闭界面</bold></red>"
#   lore:
#     - "<gray>点击后关闭当前 GUI</gray>"
#   actions:
#     left:
#       - "[close]"
#
# 私聊按钮:
#
# 'M':
#   material: PLAYER_HEAD
#   head: "%raw_name%"
#   name: "<aqua><bold>发送私聊</bold></aqua>"
#   lore:
#     - "<gray>点击后进入与该玩家的私聊界面</gray>"
#   actions:
#     left:
#       - "[player] friend chat %raw_name%"

# ------------------------------------------------------------
# 排查
# ------------------------------------------------------------
#
# 界面打不开:
# layout 每行是否 9 个字符
# YAML 缩进是否正确
# items 是否缺少 layout 里用到的字符
#
# 按钮点击无效:
# actions 是否写在按钮下面
# left / right 拼写是否正确
# 指令是否存在
#
# 头颅不显示:
# material 是否为 PLAYER_HEAD
# head 内容是否完整
# basehead 或 URL 是否复制完整
#
# 外部物品不显示:
# 对应插件是否已安装并启用
# 物品 ID 是否完整
# CraftEngine 是否写完整命名空间
# 资源包贴图是否设置 custom_model_data
#
# 出现 %placeholder% 原样文本:
# 当前界面没有提供这个占位符
# 换成同文件已有占位符，或删掉这行

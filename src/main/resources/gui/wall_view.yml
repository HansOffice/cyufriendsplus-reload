    lore:
      - "<gray>待审留言</gray> <white>%pending_count%</white> <dark_gray>|</dark_gray> <gray>待审评论</gray> <white>%pending_reply_count%</white>"
      - "<gray>%pending_hint%</gray>"
      - "<gray>%pending_reply_hint%</gray>"
      - "<white>左键</white> <gray>打开待审列表</gray>"
    actions:
      left:
        - "[player] wall pending %owner%"
  'I':
    material: PLAYER_HEAD
    head: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvODY3MjA4NWZmNWRmMGVlODUyMTM2ZTJkNDFhNzY5MjI5MjkxZDY2NmIyOGU5ZmIwNGQ2YzkyZjE1OGU0MmJiIn19fQ=="

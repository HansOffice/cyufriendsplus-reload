title: "<gradient:#5FD9FF:#82E6D2><bold>留言墙</bold></gradient> <dark_gray>|</dark_gray> <gray>%target_name%</gray>"
layout:
  - "#########"
  - "#WWWWWWW#"
  - "#WWWWWWW#"
  - "#WWWWWWW#"
  - "#WWWWWWW#"
  - "P#R#BIS#N"
items:
  '#':
    material: LIGHT_BLUE_STAINED_GLASS_PANE
    name: " "
  'W':
    material: PLAYER_HEAD
    head: "%author%"
    name: "<aqua><bold>%author% 的留言</bold></aqua>"
    lore:
      - "<gray>%time%</gray> <dark_gray>|</dark_gray> <aqua>%visibility%</aqua>"
      - "<gray>阅读</gray> <white>%unread_state%</white>"
      - "<gray>审核</gray> <white>%approve_state%</white> <dark_gray>|</dark_gray> <gray>置顶</gray> <white>%pin_state%</white>"
      - "<gray>互动</gray> <white>%like_count%</white> 赞 <dark_gray>|</dark_gray> <white>%comment_count%</white> 评 <dark_gray>|</dark_gray> <white>%like_state%</white>"
      - "%wall_pending_comment_mm%"
      - " "
      - "<white>%content%</white>"
      - " "
      - "%wall_like_hint_mm% <dark_gray>|</dark_gray> %wall_comment_hint_mm%"
      - "%wall_review_hint_mm% <dark_gray>|</dark_gray> %wall_contact_hint_mm%"
      - "%wall_pin_hint_mm%"
      - "%wall_delete_hint_mm%"
  'R':
    material: PLAYER_HEAD
    head: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNTlhNDFkYjA5MDBkYTk4MzE3NmI4Mjc5MTNhZGQ5NWM4ZjgzYmVjYmFmMWNjOThiN2NmZDAyYzE5ZGQ2NDRmOSJ9fX0="

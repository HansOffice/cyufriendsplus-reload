title: "<gradient:#5FD9FF:#82E6D2><bold>标签筛选</bold></gradient> <dark_gray>|</dark_gray> <gray>%filter_tag%</gray>"
layout:
  - "#########"
  - "#TTTTTTT#"
  - "#TTTTTTT#"
  - "#TTTTTTT#"
  - "#TTTTTTT#"
  - "P##C#B##N"
items:
  '#':
    material: LIGHT_BLUE_STAINED_GLASS_PANE
    name: " "
  'T':
    material: NAME_TAG
    name: "%tag_label_mm%"
    lore:
      - "<gray>关联好友</gray> <white>%friend_count%</white>"
      - "<gray>主标签次数</gray> <white>%primary_count%</white>"
      - "<gray>颜色值</gray> <white>%tag_color%</white>"
      - "<gray>当前状态</gray> %active_badge_mm%"
      - "<gray>排序策略</gray> <white>主标签优先，其次最近互动</white>"
      - " "
      - "<white>左键</white> <gray>按此标签筛选好友</gray>"
      - "<white>右键</white> <gray>清除当前筛选</gray>"
    actions:
      left:
        - "[player] friend tagfilter %tag_name%"
        - "[close]"
      right:
        - "[player] friend tagfilter clear"
        - "[close]"
  'P':
    material: BLUE_STAINED_GLASS_PANE
    name: "<aqua><bold>上一页</bold></aqua>"
    actions:
      left:
        - "[prev_page]"
  'N':
    material: BLUE_STAINED_GLASS_PANE
    name: "<aqua><bold>下一页</bold></aqua>"
    actions:
      left:
        - "[next_page]"
  'C':
    material: PLAYER_HEAD
    head: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMzY4MzQ2NWY3ZDBkYTJkZDA1NGQwNGViOTc0ZDdkYjkyOTA0NzgxMTc3ZmQwODAzODViNmJjOGFjMDEyN2IwOSJ9fX0="
    name: "<white><bold>清除筛选</bold></white>"
    lore:
      - "<gray>恢复完整好友列表</gray>"
    actions:
      left:
        - "[player] friend tagfilter clear"
        - "[close]"
  'B':
    material: PLAYER_HEAD
    head: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYzQ1YTExMmNmMTdlNWJmMTNiOTkzYzNkYTdmNTdmZDJhYjNhOTU1YTlhZGE2MGJiYzg5MTJmN2MwZGVhN2NjMyJ9fX0="
    name: "<white><bold>返回列表</bold></white>"
    actions:
      left:
        - "[player] friend list"
        - "[close]"

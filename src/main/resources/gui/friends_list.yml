    actions:
      left:
        - "[player] friend list clear"
  'F':
    material: PLAYER_HEAD
    head: "%raw_name%"
    name: "<aqua><bold>%friend_name%</bold></aqua>"
    lore:
      - "<gray>备注</gray> <white>%note_name%</white>"
      - "<gray>分组</gray> <white>%group_name%</white> <dark_gray>|</dark_gray> <gray>主标签</gray> %primary_tag_mm%"

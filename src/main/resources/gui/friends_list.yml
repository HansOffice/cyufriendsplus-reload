title: "<gradient:#5FD9FF:#82E6D2><bold>好友列表</bold></gradient> <dark_gray>|</dark_gray> <gray>%friend_list_focus%</gray>"
layout:
  - "####I####"
  - "##TSRCO##"
  - "#FFFFFFF#"
  - "#FFFFFFF#"
  - "#FFFFFFF#"
  - "P###B###N"
items:
  '#':
    material: LIGHT_BLUE_STAINED_GLASS_PANE
    name: " "
  'I':
    material: PLAYER_HEAD
    head: "%player_name%"
    name: "<aqua><bold>%player_name%</bold></aqua>"
    lore:
      - "<gray>当前页</gray> <white>%page%</white><gray>/</gray><white>%total_pages%</white>"
      - "<gray>好友</gray> <white>%friend_count%</white> <dark_gray>|</dark_gray> <gray>在线</gray> <aqua>%friend_online_count%</aqua>"
      - "<gray>当前焦点</gray> <white>%current_tab%</white>"
      - "<gray>搜索</gray> <white>%search_keyword%</white>"
      - "<gray>排序</gray> <white>%sort_mode%</white>"
  'T':
    material: PLAYER_HEAD
    head: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNzYxNDMxOGVmMjQ3ZDExZmYwZjU2MGQxYzY1OWU0MjU2Yzk0MWRlMzQ3OGU3YmUxZDcxOTI4Y2QwMzFmYTdjNiJ9fX0="

      - "<white>Shift + 右键</white> <gray>解除好友</gray>"
    actions:
      left:
        - "[player] friend profile %raw_name%"
      shift_right:
        - "[player] friend removeconfirm %raw_name%"
  'P':
    material: BLUE_STAINED_GLASS_PANE
    name: "<aqua><bold>上一页</bold></aqua>"
    lore:
      - "<gray>当前页</gray> <white>%page%</white><gray>/</gray><white>%total_pages%</white>"

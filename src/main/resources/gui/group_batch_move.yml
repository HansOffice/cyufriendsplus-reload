title: "<gradient:#5FD9FF:#82E6D2><bold>批量移动</bold></gradient> <dark_gray>|</dark_gray> <gray>%group_name%</gray>"
layout:
  - "####I####"
  - "#GGGGGGG#"
  - "#GGGGGGG#"
  - "#GGGGGGG#"
  - "#GGGGGGG#"

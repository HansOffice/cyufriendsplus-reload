    name: "<aqua><bold>整组移动</bold></aqua>"
    lore:
      - "<gray>来源分组</gray> <white>%source_group%</white>"
      - "<gray>成员数量</gray> <white>%source_count%</white>"
      - "<gray>左键选择目标分组后，整组好友会一起移动</gray>"
  'G':
    material: PLAYER_HEAD
    head: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYmVkNjY0OGNiYzYzZjVkM2I0ODNmNWUzOGQxMzJiNmYwY2JlZGUxMzU0YTQ0NWFmNTIyNWY1NmJkYzE3YTZhMyJ9fX0="

      - "<gray>在线状态</gray> <aqua>%online_scope%</aqua> <dark_gray>|</dark_gray> <gray>服务器</gray> <white>%server_name%</white>"
      - " "
      - "<white>左键</white> <gray>标签管理</gray> <dark_gray>|</dark_gray> <white>中键</white> <gray>查看详情</gray>"
      - "<white>右键</white> <gray>主标签颜色</gray>"

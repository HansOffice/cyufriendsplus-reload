      - "<gray>真实名称</gray> <white>%raw_name%</white>"
      - "<gray>备注名称</gray> <white>%note_name%</white>"
      - "<gray>所属分组</gray> <white>%group_name%</white> <dark_gray>|</dark_gray> <gray>显示</gray> <white>%group_pin_state%</white>"
      - "<gray>主标签</gray> %primary_tag_mm% <dark_gray>|</dark_gray> <gray>标签数</gray> <white>%tag_count%</white>"

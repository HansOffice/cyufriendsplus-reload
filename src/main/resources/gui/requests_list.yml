      left:
        - "[player] friend home"
  'O':
    material: PLAYER_HEAD
    head: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNDVhY2FkZmNlNzJjYmQ1ZTJmNzcwZjFjZjJhNzU5OTQyM2VmYjE4ZjgyMTk0MTJiYzcxZmIzNDg5MjMwOWIwNiJ9fX0="
    name: "<green><bold>发出申请</bold></green>"

title: "<gradient:#5FD9FF:#82E6D2><bold>私聊会话</bold></gradient> <dark_gray>|</dark_gray> <gray>%target_name%</gray>"
layout:
  - "#########"
  - "#MMMMMMM#"
  - "#MMMMMMM#"
  - "#MMMMMMM#"
  - "# Q I B #"
  - "P#######N"
items:
  '#':
    material: LIGHT_BLUE_STAINED_GLASS_PANE
    name: " "
  'M':
    material: PLAYER_HEAD
    head: "%sender_name%"
    name: "<aqua><bold>%direction%</bold></aqua>"
    lore:
      - "<gray>时间</gray> <white>%time%</white>"
      - " "
      - "<white>%content%</white>"
  'Q':
    material: PLAYER_HEAD
    head: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYjQ4Y2UxY2YxOGFmMDVhNTc2ZDYwODEyMzAwMWI3OTFmZWRiNjIyOTExZWY4ZDM4YTMyMGRhM2JjYmY2ZmQyMCJ9fX0="
    name: "<aqua><bold>快捷问候</bold></aqua>"
    lore:
      - "<gray>发送 你好呀</gray>"
      - "<gray>当前状态</gray> <white>%online_scope%</white>"
      - "<gray>所在服务器</gray> <white>%server_name%</white>"
    actions:
      left:
        - "[player] msg %raw_name% 你好呀"
  'I':
    material: PLAYER_HEAD
    head: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvODY3MjA4NWZmNWRmMGVlODUyMTM2ZTJkNDFhNzY5MjI5MjkxZDY2NmIyOGU5ZmIwNGQ2YzkyZjE1OGU0MmJiIn19fQ=="
    name: "<yellow><bold>输入消息</bold></yellow>"
    lore:
      - "<gray>在聊天栏输入要发送的内容</gray>"
      - "<gray>当前状态</gray> <white>%online_scope%</white>"
      - "<gray>所在服务器</gray> <white>%server_name%</white>"
    actions:
      left:
        - "[pm_input] %raw_name%"
  'B':
    material: PLAYER_HEAD
    head: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYzQ1YTExMmNmMTdlNWJmMTNiOTkzYzNkYTdmNTdmZDJhYjNhOTU1YTlhZGE2MGJiYzg5MTJmN2MwZGVhN2NjMyJ9fX0="
    name: "<white><bold>会话列表 / 好友资料</bold></white>"
    lore:
      - "<white>左键</white> <gray>返回最近会话</gray>"
      - "<white>右键</white> <gray>打开好友资料</gray>"
    actions:
      left:
        - "[player] friend messages"
      right:
        - "[player] friend profile %raw_name%"
  'P':
    material: BLUE_STAINED_GLASS_PANE
    name: "<aqua><bold>上一页</bold></aqua>"
    actions:
      left:
        - "[prev_page]"
  'N':
    material: BLUE_STAINED_GLASS_PANE
    name: "<aqua><bold>下一页</bold></aqua>"
    actions:
      left:
        - "[next_page]"
